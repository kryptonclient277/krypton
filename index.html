<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Krypton Client Download</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(180deg,#02152c,#05284f,#00101d);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background-image:
radial-gradient(white 1px,transparent 1px),
radial-gradient(#66ccff 1px,transparent 1px);
background-size:80px 80px,120px 120px;
animation:move 35s linear infinite;
opacity:.5;
}

@keyframes move{
from{transform:translateY(0);}
to{transform:translateY(200px);}
}

.box{
position:relative;
width:360px;
padding:30px;
background:rgba(0,0,0,.45);
backdrop-filter:blur(12px);
border:1px solid #00bfff;
border-radius:20px;
text-align:center;
box-shadow:0 0 30px #00bfff;
z-index:2;
}

h1{
font-size:30px;
margin-bottom:8px;
}

p{
opacity:.8;
margin-bottom:18px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
margin-bottom:15px;
font-size:17px;
text-align:center;
outline:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:#00bfff;
color:white;
transition:.3s;
}

button:hover{
background:#0098d9;
transform:scale(1.03);
}

#msg{
margin-top:15px;
font-weight:bold;
color:#ff7070;
}

#success{
display:none;
margin-top:15px;
color:#00ff99;
font-weight:bold;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="box">

<h1>🔒 Krypton Client</h1>

<p>Dosyayı indirebilmek için şifreyi gir.</p>

<input
type="password"
id="password"
placeholder="Şifre">

<button onclick="downloadFile()">
DOWNLOAD
</button>

<div id="msg"></div>

<div id="success">
✔ Şifre doğru! İndirme başlatılıyor...
</div>

</div>

<script>

const PASSWORD="0987";

function downloadFile(){

let pass=document.getElementById("password").value;

if(pass===PASSWORD){

document.getElementById("msg").innerHTML="";
document.getElementById("success").style.display="block";

setTimeout(function(){

const a=document.createElement("a");

/* BURAYA DOSYANIN ADINI YAZ */
a.href="KryptonClient.zip";

a.download="KryptonClient.zip";

document.body.appendChild(a);

a.click();

a.remove();

},1200);

}else{

document.getElementById("success").style.display="none";

document.getElementById("msg").innerHTML="❌ Yanlış şifre!";

}

}

</script>

</body>
</html>
