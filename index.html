<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krypton Client</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:#081b29;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:white;
}
body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
animation:stars 40s linear infinite;
opacity:.3;
}
@keyframes stars{
from{transform:translateY(0);}
to{transform:translateY(300px);}
}
.box{
position:relative;
background:#0d2b45;
padding:30px;
width:340px;
border-radius:15px;
box-shadow:0 0 20px #00bfff;
text-align:center;
z-index:2;
}
h1{
margin-bottom:10px;
}
p{
margin-bottom:15px;
color:#ddd;
}
input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-bottom:15px;
font-size:16px;
}
button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#00bfff;
color:white;
font-size:17px;
cursor:pointer;
}
button:hover{
background:#0095cc;
}
#msg{
margin-top:15px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h1>🔒 Krypton Client</h1>
<p>Dosyayı indirmek için şifreyi gir.</p>

<input id="pass" type="password" placeholder="Şifre">

<button onclick="indir()">DOWNLOAD</button>

<div id="msg"></div>

</div>

<script>

function indir(){

let sifre=document.getElementById("pass").value;

if(sifre==="0987"){

document.getElementById("msg").style.color="#00ff99";
document.getElementById("msg").innerHTML="✔ Şifre doğru! İndiriliyor...";

setTimeout(function(){

window.location.href="Krypton%20Client.jar";

},1000);

}else{

document.getElementById("msg").style.color="red";
document.getElementById("msg").innerHTML="❌ Yanlış şifre!";

}

}

</script>

</body>
</html>
